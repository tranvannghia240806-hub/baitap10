<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1f4e79, #4a90a4); min-height: 100vh; }
        .login-card { max-width: 400px; width: 100%; border: 0; border-radius: 1rem; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
<div class="card login-card shadow-lg m-3">
    <div class="card-body p-4">
        <h3 class="text-center mb-1">Đăng nhập</h3>
        <p class="text-center text-muted mb-4">Spring Boot 3 &middot; Security 6 &middot; JWT</p>

        <div id="loginError" class="alert alert-danger py-2 d-none" role="alert"></div>

        <form action="" method="post" onsubmit="return false;">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" name="email" id="email"
                       placeholder="ten@hcmute.edu.vn" required="required">
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" name="password" id="password"
                       required="required" autocomplete="on">
            </div>
            <button id="Login" type="button" class="btn btn-primary w-100">Login</button>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/mainjs.js"></script>
</body>
</html>
